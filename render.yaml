services:
  # ── Backend (FastAPI) ──────────────────────────────────────
  - type: web
    name: sunmarke-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./sunmarke_ai.db
      - key: PORT
        value: 8000
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        sync: false          # set to your frontend URL after deploy

  # ── Frontend (Next.js) ────────────────────────────────────
  - type: web
    name: sunmarke-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false          # set to your backend URL after deploy
